server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 100M file uploads without Nginx 413 error
    client_max_body_size 100M;

    # Reverse-proxy API calls to the backend so relative
    # fetch('/api/...') calls in the frontend code work
    # without needing to know the backend's real domain.
    location /api/ {
        proxy_pass https://api.avbt.in/api/;
        proxy_set_header Host api.avbt.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        # Extended timeouts for large media uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_body_timeout 120s;
    }

    # SPA fallback: any route not matching a real file
    # (e.g. /portfolio, /about) gets served index.html,
    # so React Router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
